# Ground truth for the generalization set (eval/generalization/).
#
# Authored by hand AFTER the documents, by reading them as a person would. The
# configured schemas in docint/config.py were NOT changed to accommodate any of
# this - that is the point of the exercise.
#
# Three outcome categories, deliberately distinguished:
#
#   value:        the document states this, and the pipeline should extract it
#   must_be_null: the document genuinely does not contain it; extracting anything
#                 here is a HALLUCINATION, which is worse than a miss
#   schema_mismatch: the document is well-formed but the configured schema does not
#                 fit it (e.g. a single `quantity` field against a six-line invoice).
#                 Not a pipeline bug. Recorded separately, because conflating it with
#                 an extraction error would hide the real finding.

documents:

  G1_invoice_northstar_multipage.pdf:
    what_makes_it_hard: >-
      Alternate labels throughout (Our Ref / Bill Date / Your Order / Amount
      Payable), a long-form date, two pages with the line-item table continuing
      overleaf, and extra fields with no schema slot (settlement discount, VAT).
    expect_document_type: invoice
    expect_file_type: pdf_digital
    fields:
      invoice_number: {value: "NF/24518"}                 # labelled "Our Ref"
      vendor_name:    {value: "Northstar Fabrication Ltd."}
      invoice_date:   {value: "2026-04-11"}               # from "11 April 2026"
      po_reference:   {value: "PO-2026-0091"}             # labelled "Your Order"
      total_amount:   {value: 4865.45}                    # labelled "Amount Payable"
    line_items:
      count: 6                                            # 4 on page 1, 2 on page 2
      items:
        - {description_contains: "bracket",  quantity: 120, unit_price: 18.40, amount: 2208.00}
        - {description_contains: "dowel",    quantity: 500, unit_price: 1.15,  amount: 575.00}
        - {description_contains: "Weld nut", quantity: 800, unit_price: 0.62,  amount: 496.00}
        - {description_contains: "gland",    quantity: 250, unit_price: 2.05,  amount: 512.50}
        - {description_contains: "Hex bolt", quantity: 300, unit_price: 0.94,  amount: 282.00}
        - {description_contains: "Carriage", quantity: 1,   unit_price: 85.00, amount: 85.00}

  G2_invoice_stamped_scan.pdf:
    what_makes_it_hard: >-
      Scanned, with a rotated PAID stamp and a handwritten cheque annotation over
      the body. Critically, it carries NO purchase-order reference of any kind -
      po_reference must come back null rather than invented.
    expect_document_type: invoice
    expect_file_type: pdf_scanned
    fields:
      invoice_number: {value: "BES-77310"}
      vendor_name:    {value: "Bayside Electrical Supply"}
      invoice_date:   {value: "2026-03-22"}
      po_reference:   {must_be_null: "absent from the document - extracting a value here is a hallucination"}
      total_amount:   {value: 4942.00}
    line_items:
      count: 3
      items:
        - {description_contains: "THHN",       quantity: 12, amount: 1428.00}
        - {description_contains: "Panelboard", quantity: 4,  amount: 3196.00}
        - {description_contains: "EMT",        quantity: 40, amount: 318.00}

  G3_blanket_purchase_agreement.pdf:
    what_makes_it_hard: >-
      Never uses the words "purchase order" - it is a BLANKET PURCHASE AGREEMENT.
      Has no single total line; the cap is stated as "Maximum Commitment" beneath
      a three-line table of per-line values.
    expect_document_type: purchase_order
    expect_file_type: pdf_digital
    fields:
      po_number:        {value: "BPA-4471-26"}            # labelled "Agreement No."
      vendor_name:      {value: "Vertex Aerospace Components Inc."}
      issue_date:       {value: "2026-01-15"}             # labelled "Effective"
      buyer_entity:     {value: "Northwind Manufacturing LLC"}
      committed_amount: {value: 200150.00}                # labelled "Maximum Commitment"
    line_items:
      count: 3
      items:
        - {description_contains: "fastener",   quantity: 2000, unit_price: 68.00,  amount: 136000.00}
        - {description_contains: "collar",     quantity: 1500, unit_price: 22.50,  amount: 33750.00}
        - {description_contains: "inspection", quantity: 40,   unit_price: 760.00, amount: 30400.00}

  G4_po_amended_scan.pdf:
    what_makes_it_hard: >-
      Scanned, with a handwritten amendment striking through the printed order value
      and writing a different figure above it. A system that silently merges the two,
      or that returns the value the document crossed out, is wrong.
    # GOLD REVERSED - by a policy decision, not by a result.
    #
    # This expected 18750.00 (the printed figure) on the grounds that the handwritten
    # amendment is uncountersigned while the document's own footer says amendments
    # must be countersigned. The product owner has decided the opposite rule: a struck
    # value has been retired by the document, and the surviving value beside it is
    # what the document now asserts. Expected is therefore 19400.00.
    #
    # Recording why the distinction matters: gold may be changed by a decision about
    # what the right answer IS, and must never be changed to match what the system
    # happened to output. The earlier reading is still defensible - see
    # eval/holdout_findings.md - and it lost on a judgement call, not on evidence.
    expect_document_type: purchase_order
    expect_file_type: pdf_scanned
    fields:
      po_number:        {value: "HC-2026-8802"}           # labelled "Order No."
      vendor_name:      {value: "Harlow Components GmbH"}
      issue_date:       {value: "2026-03-05"}             # labelled "Dated"
      buyer_entity:     {value: "Northwind Manufacturing LLC"}
      committed_amount: {value: 19400.00, note: "handwritten survivor; the printed EUR 18,750.00 is struck through and therefore retired"}

  G5_receipt_office_supply.pdf:
    what_makes_it_hard: >-
      A retail receipt. Invoice-adjacent - it has a vendor, a date, line items and
      a total - but it is not one of the three configured types. The correct answer
      is `unknown`. Forcing it into `invoice` is the failure this case tests for.
    expect_document_type: unknown
    expect_file_type: pdf_digital
    fields: {}

  G6_receipt_thermal_scan.pdf:
    what_makes_it_hard: >-
      A scanned thermal fuel receipt: narrow, monospaced, degraded. Unsupported
      type AND poor recognition at once.
    expect_document_type: unknown
    expect_file_type: pdf_scanned
    fields: {}

  G7_supplier_terms_horizontal.xlsx:
    what_makes_it_hard: >-
      A vendor record laid out horizontally (one supplier per row, attributes across
      columns) on a sheet called "Supplier Terms" rather than "Vendors", and holding
      THREE suppliers rather than one. The configured schema describes a single
      vendor, so which row is extracted is genuinely underdetermined.
    expect_document_type: vendor_record
    expect_file_type: xlsx
    expect_status: needs_review_missing_fields
    # An earlier version of this gold accepted "any one of the three suppliers" as a
    # pass. That was wrong: returning one arbitrary row is not a correct answer,
    # because a consumer would believe the workbook describes a single supplier at
    # that rate. The required outcome is to decline to pick, leave the required fields
    # empty, and route to human review with the classification preserved.
    #
    # CORRECTION. This comment used to read "the right outcome is what the pipeline
    # now does", citing the behaviour as evidence that the design was right. It was
    # not: nothing in the extraction prompt asked the model to decline, and a later
    # run picked row 1 on 5 of 5 attempts - three invented values at status=extracted,
    # with no flag. An observation had been promoted to a design claim. The prompt now
    # states the multi-instance policy explicitly (docint/understand.py), and declining
    # is measured at 5/5 rather than assumed.
    fields:
      vendor_id:               {must_be_null: "three candidate suppliers; picking one arbitrarily is fabrication"}
      vendor_name:             {must_be_null: "three candidate suppliers"}
      contracted_unit_price:   {must_be_null: "three candidate rates - 124.00 / 68.00 / 18.40"}
    consistency_requirement: >-
      If a future repeating-vendor schema is added and values ARE returned, all fields
      for a given supplier must come from the same row.

  G8_safety_data_sheet.pdf:
    what_makes_it_hard: >-
      A chemical safety data sheet - genuinely unrelated to procurement documents.
      A clean negative case with no near-miss features.
    expect_document_type: unknown
    expect_file_type: pdf_digital
    fields: {}
